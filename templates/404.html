<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Masahir Abbas</title>
    <meta name="description" content="The page you are looking for could not be found.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='masahir-abbas-favicon.jpeg') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3B82F6;
            --secondary-color: #111827;
            --light-bg: #F9FAFB;
            --text-dark: #1F2937;
            --text-light: #F3F4F6;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: var(--text-dark);
            background-color: var(--light-bg);
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        a { text-decoration: none; color: inherit; transition: color 0.3s ease; }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* --- 404 SECTION --- */
        .error-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px 20px;
            background-color: var(--light-bg);
        }

        .error-content { max-width: 640px; }

        /* BACK ARROW (top-left corner) - sirf arrow clickable hai, text nahi */
        .back-corner {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
            max-width: 1240px; /* case study page ke left alignment se match */
            margin: 0 auto;
            padding: 0 20px;
            text-align: left;
        }
        .back-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .back-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background-color: transparent;
            color: #111827;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .back-arrow svg { width: 22px; height: 22px; display: block; }
        .back-arrow:hover,
        .back-arrow:focus-visible { background-color: #E5E7EB; color: #111827; outline: none; }
        .back-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 1.1rem;
            color: #111827;
            background: transparent;
            pointer-events: none; /* text clickable nahi */
        }

        .error-code {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(6rem, 22vw, 11rem);
            line-height: 1;
            margin: 0 0 10px 0;
            color: var(--primary-color);
            letter-spacing: 4px;
        }
        .error-code .zero {
            color: var(--secondary-color);
        }

        .error-content h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 2.2rem;
            color: var(--secondary-color);
            margin: 0 0 1rem 0;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .error-content p {
            font-size: 1.2rem;
            color: #4B5563;
            margin: 0 auto;
            max-width: 520px;
            opacity: 0;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }




        /* --- NAVIGATION BAR (same as main site) --- */
        .navbar { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(249, 250, 251, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 1000; box-sizing: border-box; border-bottom: 1px solid rgba(0,0,0,0.05); transition: all 0.3s ease; }
        .navbar.scrolled { background: rgba(17, 24, 39, 0.90); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 5%; }
        .nav-container { display: flex; width: 100%; align-items: center; justify-content: center; }
        .nav-links { display: flex; list-style: none; margin: 0; padding: 0; gap: 30px; }
        .nav-left, .nav-right { flex: 1; display: flex; }
        .nav-left { justify-content: flex-end; } .nav-right { justify-content: flex-start; }

        .nav-logo { font-size: 1.5rem; font-weight: 800; color: var(--primary-color); text-decoration: none; letter-spacing: 1px; margin: 0 40px; flex-shrink: 0; }
        .nav-links li a { color: var(--secondary-color); font-weight: 600; font-size: 1rem; position: relative; padding-bottom: 5px; text-decoration: none; }
        .navbar.scrolled .nav-links li a { color: var(--text-light); }

        .nav-links li a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 0; left: 0; background-color: var(--primary-color); transition: width 0.3s ease; }
        .nav-links li a:hover::after { width: 100%; }

        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 5px; }
        .hamburger span { display: block; width: 25px; height: 3px; background-color: var(--secondary-color); transition: all 0.3s ease; }
        .navbar.scrolled .hamburger span { background-color: var(--text-light); }
        .mobile-logo { display: none; }

        @media (max-width: 900px) {
            .mobile-logo { display: block; margin: 0; }
            .desktop-logo { display: none; }
            .hamburger { display: flex; }
            .nav-container { position: absolute; top: 100%; left: -100%; width: 100%; background: rgba(17, 24, 39, 0.98); flex-direction: column; text-align: center; padding: 20px 0; transition: left 0.3s ease; }
            .nav-container.active { left: 0; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
            .nav-links { flex-direction: column; width: 100%; gap: 20px; padding: 10px 0; }
            .nav-left, .nav-right { flex-direction: column; }
            .nav-links li a { color: var(--text-light); font-size: 1.2rem; }
        }

        @media (max-width: 600px) {
            .error-content h1 { font-size: 1.7rem; }
            .error-content p { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar" id="navbar">
        <a href="{{ url_for('home') }}" class="nav-logo mobile-logo">HOME</a>

        <div class="nav-container" id="navContainer">
            <ul class="nav-links nav-left">
                <li><a href="{{ url_for('home') }}#about">About</a></li>
                <li><a href="{{ url_for('home') }}#projects">Projects</a></li>
                <li><a href="{{ url_for('home') }}#education-and-interests">Education</a></li>
            </ul>

            <a href="{{ url_for('home') }}" class="nav-logo desktop-logo">HOME</a>

            <ul class="nav-links nav-right">
                <li><a href="{{ url_for('home') }}#certifications">Certificates</a></li>
                <li><a href="{{ url_for('home') }}#testimonials">Testimonials</a></li>
                <li><a href="{{ url_for('home') }}#contact">Contact</a></li>
            </ul>
        </div>

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <main class="error-section">
        <div class="back-corner">
            <div class="back-row">
                <a href="{{ url_for('home') }}" class="back-arrow" aria-label="Back to Home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </a>
                <span class="back-text">Back</span>
            </div>
        </div>

        <div class="error-content">
            <div class="error-code">4<span class="zero">0</span>4</div>
            <h1>Page Not Found</h1>
            <p>The page you're looking for doesn't exist, was moved, or the link may be incorrect.</p>
        </div>
    </main>

    <script>
        const navbar = document.getElementById('navbar');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        function toggleMenu() {
            if (window.innerWidth <= 900) {
                document.getElementById('navContainer').classList.toggle('active');
            }
        }
    </script>

</body>
</html>
